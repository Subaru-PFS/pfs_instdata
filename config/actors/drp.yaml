drp: &DRP
  listen:
    interface: shell2-ics

  hubLink:
    keepAlive:
      idle: 60          # seconds without traffic before the first probe
      interval: 10      # seconds between probes
      count: 6          # unanswered probes before the connection is failed
      userTimeout: 120  # seconds data may stay unacknowledged before the connection is failed
    pingPeriod: 120     # seconds between hub pings

  engine: &ENGINE

    butler: &BUTLER
      datastore: /work/datastore
      raw: PFS/raw/sps
      pfsConfig: PFS/raw/pfsConfig
      input: PFS/defaults
      output: drpActor/reductions

    pipeline: &PIPE
      yaml: pipelines/hilo.yaml
      fail_fast: true
      groupVisit: true

    ingest: &INGEST
      mode: copy     # copy|link

    execution: &EXEC
      numProc: 16          # process-level parallelism (quanta in parallel)
      taskThreads: 1       # threads per quantum (keep 1 if OMP/BLAS set to 1)
      clobberOutput: true

    opdb: &OPDB
      host:
        pfsa-db

    lsstLog:
      level: 10 # logging.DEBUG=10   logging.INFO=20   logging=WARNING 30
      long_log: False

    detrendCallback: &CB
      activated: false
      useSilentThread: true
      waitInterval: 2
      timeout: 180

  H:
    engine:
      <<: *ENGINE

  S:
    engine:
      <<: *ENGINE
      butler:
        <<: *BUTLER
        datastore: /data/drp/datastore
      ingest:
        <<: *INGEST
        mode: link
      pipeline:
        <<: *PIPE
        yaml: pipelines/summit.yaml
        groupVisit: false
      execution:
        <<: *EXEC
        numProc: 10
      opdb:
        <<: *OPDB
        host: db-ics

      detrendCallback:
        <<: *CB
        activated: true

drp2:
  <<: *DRP
  tron:
    host: 133.40.164.64
  listen:
    interface: pfsa-usr03
    port: 10000
  logging:
    logdir: /work/mhs/logs/actors/drp2
