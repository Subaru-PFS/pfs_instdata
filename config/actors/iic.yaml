iic:
  # Book-keeping section
  pfsDesign:
    rootDir: /data/pfsDesign
  pfsConfig:
    doUpdateEngineeringFiberStatus: True # set fiberStatus to UNILLUMINATED for unilluminated fibers for eng fibers
    doUpdateScienceFiberStatus: True # set fiberStatus to UNILLUMINATED for unilluminated fibers for science fibers
    maxDeltaINSROT: 40 # setting 40 deg the limit above you set INSROT_MISMATCH in pfsConfig
  maskFiles:
    rootDir: /data/fps/maskFiles
  # Command config section
  ## Global parameters
  illuminators: &illuminators
    doTurnOnIlluminator: True
    cableBLampOn: False
    useBiaCallback: False  # False = legacy 'bia on/off'
  mcs:
    exptime: &mcsExptime 4.8
  ag:
    fit_dScale: True
  ## Per command parameters
  moveToPfsDesign: &moveToPfsDesign
    exptime: *mcsExptime
    nIteration: 8
    tolerance: 0.005
    noHome: False
    twoStepsOff: False
    shortExpOff: False
    noTweak: False
    skipFiducialInterferenceCheck: False

  nearDotConvergence:
    <<: *moveToPfsDesign
    nIteration: 16
    noTweak: True
    shortExpOff: True
    skipFiducialInterferenceCheck: True

  # The two flux sequences across the black dots.  Both converge near the dots first and
  # differ in where that convergence leaves the fleet, and in what the flats do next.
  #
  # dotRoach hides: the convergence blind-moves each cobra to its calibrated optimum, and
  # each flat corrects only the cobras whose flux says they are still lit.  It lands at
  # 0.2 so a blind move that falls short still leaves the cobra behind its dot.
  #
  # dotScan measures: it lands shallow with no blind move and walks the whole fleet across
  # in uniform steps, so the obscuration curve is sampled past the optimum as well as up
  # to it.  This is the calibration that produces cobra_dot_target.csv, and it leaves the
  # fleet at no useful depth.
  dotRoach:
    nIteration: 8
    nearDotConvergence:
      dotLanding: 0.2
  dotScan:
    nIteration: 12
    nearDotConvergence:
      noBlindMove: True
      dotLanding: 0.1

  dotCrossing: &dotCrossing
    exptime: *mcsExptime
    count: 40
  phiCrossing:
    <<: *dotCrossing
    stepSize: 40
  thetaCrossing:
    <<: *dotCrossing
    stepSize: -40

  moveToDotByMcs:
    dotTarget: dotCenter
    iteration: 20
    overshootFraction: 0.5

  moveToDotByFlux:
    nIteration: 12

  windowedFlat:
    pfiLamps:
      exptime: 15
      redWindow: 600,800
      blueWindow: 2500,800
    hscLamps:
      exptime: 5.0
      redWindow: 600,500
      blueWindow: 2500,500

  fiberProfiles:
    nTraceBefore: 1
    nTraceAfter: 1

  scienceExposure:
    mcsExposureBefore:
      enabled: true
      exptime: *mcsExptime
      doFibreId: true
      skipWindowed: true # skip MCS exposure for windowed scienceExposure.

  thetaPhiScan:
    scienceTrace:
      exptime: 20
      idDict: # convenience to directly resolve cameras given inputs and default config.
        arm: b,r
    phiAngles: [25, 55, 85, 115, 145, 175]
    thetaAngles: [ 20,  50,  80, 110, 140, 170, 200, 230, 260, 290, 320, 350]
    scanPhiHome: True # driving phi to home after the first convergence
    scanThetaHome: True  # driving theta to home after the first convergence

    moveToPfsDesign:
      <<: *moveToPfsDesign
      nIteration: 6
      tolerance: 0.1
      noTweak: True
      noHome: True
      shortExpOff: True
      twoStepsOff: True

