fps:
  listen:
    interface: actors-ics
  opdb:
    host: db-ics
  convergence:
    # [mm] a cobra further than this from its target is FiberStatus.NOTCONVERGED.
    # Floored at 5 * the requested tolerance.
    notConvergedDistanceThreshold: 0.05
    # Refuse the design past this many science targets failing validation.
    # ~1% of the fleet, above the worst of the 478 most recent designs (max 24).
    maxInvalidScienceTargets: 25
    # Where a cobra goes when fps will not send it to its design target.  A policy, not
    # a law, so it is recorded in the pfsConfig header: it cannot be backfilled.
    # Only BLACKSPOT is implemented; anything else raises.
    targetFallback:
      invalid: BLACKSPOT
      unassigned: BLACKSPOT
    # Aim the black-dot push through the default blind-move calibration, the newest one
    # fps validateBlindMove passed; false pushes every dot cobra to its wanted depth.
    dotCalibration: true
    # Depths of a dot convergence, in dot fraction (0 = entry edge, 0.5 = dot centre).
    # Every dot cobra lands at dotLanding, the ramp's last row, which is where the
    # blind-move calibration is measured, then is pushed to dotTarget, the dot centre the
    # calibration aims at.  fps dotConfig overrides them until fps restarts, and
    # moveToPfsDesign dotLanding= and dotTarget= for one convergence.
    dotLanding: 0.1
    dotTarget: 0.5
    # Whether the landing of a calibrated cobra is aimed too, commanded so that its landing
    # gain brings it to dotLanding.  fps dotConfig dotLandingAim= sets it until fps
    # restarts, and moveToPfsDesign aimLanding for one convergence.
    dotLandingAim: false

