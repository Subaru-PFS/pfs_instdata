fps:
  listen:
    interface: actors-ics
  opdb:
    host: db-ics
  convergence:
    # [mm] a cobra further than this from its target is FiberStatus.NOTCONVERGED.
    # Floored at 5 * the requested tolerance.
    notConvergedDistanceThreshold: 0.05
    # Refuse the design past this many science targets failing validation.
    # ~1% of the fleet, above the worst of the 478 most recent designs (max 24).
    maxInvalidScienceTargets: 25
    # Where a cobra goes when fps will not send it to its design target.  A policy, not
    # a law, so it is recorded in the pfsConfig header: it cannot be backfilled.
    # Only BLACKSPOT is implemented; anything else raises.
    targetFallback:
      invalid: BLACKSPOT
      unassigned: BLACKSPOT
    # Aim the black-dot push through the default blind-move calibration, the newest one
    # fps validateBlindMove passed; false pushes every dot cobra to its wanted depth.
    dotCalibration: true

